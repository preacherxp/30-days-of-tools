<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · 30 tools in 30 days</title>
  <link rel="icon" href="/30-days-of-tools/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("theme")
        || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch {}
  </script>
  <style>
    :root { --bg: #f5f4f0; --ink: #111111; --muted: #6b6b6b; color-scheme: light; }
    [data-theme="dark"] { --bg: #181818; --ink: #f5f4f0; --muted: #9b9b9b; color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink); font: 400 16px/24px "Geist", system-ui, sans-serif;
    }
    main { padding: 32px; text-align: center; }
    b { display: block; font-family: "Geist Mono", monospace; font-size: 72px; line-height: 1; font-weight: 500; color: #e8492f; }
    h1 { margin: 24px 0 8px; font-size: 24px; line-height: 32px; font-weight: 600; }
    p { margin: 0 0 24px; color: var(--muted); }
    a {
      display: inline-block; padding: 8px 12px; border-radius: 8px;
      background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #e8492f; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <b>Day 31</b>
    <h1>This day isn't on the calendar</h1>
    <p>The challenge runs for 30 days, and this page isn't one of them.</p>
    <a href="/30-days-of-tools/">Back to the calendar</a>
  </main>
</body>
</html>
